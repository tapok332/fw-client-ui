name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        run: npm run build

      # After the build: next build generates next-env.d.ts and
      # .next/types/routes.d.ts, which tsc needs to resolve static-asset
      # imports and typed routes. Running it earlier fails with TS2307.
      - name: Type check
        run: npm run typecheck
